services:
  ilo-fan-controller:
    image: ghcr.io/vietnamvps/ilo-fan-controller:latest
    container_name: ilo-fan-controller
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Toàn bộ thông tin iLO, presets và tài khoản được cấu hình trên Web UI và lưu vào đây
      - ./data:/app/data
